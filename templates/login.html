<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanima Scanner - Login</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/logoOnly.png') }}" type="image/x-icon">
    <link rel="icon" href="{{ url_for('static', filename='images/logoOnly.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="sideBars"></div>
    <div id="loading">
      <img class="preloader-img preloader-theyyam" src="{{ url_for('static', filename='images/theyyam face.png') }}" alt="Theyyam">
      <img class="preloader-img preloader-kathakali" src="{{ url_for('static', filename='images/Kathakali face.png') }}" alt="Kathakali">
      <div class="loader-flex">
        <div class="thanima-loader" id="loader">
          <img src="{{ url_for('static', filename='images/_350F17__4_-removebg-preview.png') }}" alt="Thanima Logo" class="thanima-logo">
          <div class="loading-overlay"></div>
        </div>
      </div>
    </div>
    <img class="thanima_logo2" src="{{ url_for('static', filename='images/logoOnly.png') }}" alt="">
    <h2>Login</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if
        messages %}
        {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    <form class="loginForm" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <input class="login" type="submit" value="Login" />
    </form>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var l = document.getElementById('loading');
          if (l) l.classList.add('preloader-in');
        }, 100);
      });

      window.addEventListener("load", function () {
        setTimeout(function () {
          const loading = document.getElementById("loading");
          if (loading) {
            loading.classList.add("preloader-out");
            loading.style.opacity = "0";
            loading.style.transition = "opacity 0.7s ease-out";
            setTimeout(function () {
              loading.style.display = "none";
            }, 700);
          }
        }, 400);
      });
    </script>
  </body>
</html>
